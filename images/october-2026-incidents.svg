<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" width="640" height="390" role="img" aria-labelledby="t d">
  <title id="t">Notable security incidents in October 2026</title>
  <desc id="d">Timeline of AI developer platforms that disclosed security incidents in October 2026, by disclosure date: Fireworks AI Oct 6, Andromeda Oct 9, Zeabur Oct 14, Lightning AI Oct 15, OpenCode Oct 16, PingCAP Oct 19, Railway Oct 20, Warp Oct 23, CommandCode Oct 28, Northflank Oct 30.</desc>
  <style>
    .bg { fill: #fcfcfb; }
    .dot { fill: #2a78d6; stroke: #fcfcfb; stroke-width: 2; }
    .stem { stroke: #c9c8c2; stroke-width: 1; }
    .axis { stroke: #8a8984; stroke-width: 2; }
    .t1 { fill: #0b0b0b; font: 600 16px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .t2 { fill: #52514e; font: 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .name { fill: #0b0b0b; font: 600 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .date { fill: #52514e; font: 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .foot { fill: #52514e; font: 600 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .rule { stroke: #e4e3df; stroke-width: 1; }
    .note { fill: #52514e; font: 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1a19; }
      .dot { fill: #3987e5; stroke: #1a1a19; }
      .stem { stroke: #4a4944; }
      .axis { stroke: #8a8984; }
      .t1, .name { fill: #f0efec; }
      .t2, .date, .note, .foot { fill: #c3c2b7; }
      .rule { stroke: #33332f; }
    }
  </style>
  <rect class="bg" width="640" height="390" rx="8"/>
  <text class="t1" x="24" y="34">Notable security incidents in October 2026</text>
  <text class="t2" x="24" y="54">AI developer platforms that disclosed breaches, by disclosure date</text>

  <!-- axis: x = 40 + (day - 1) * 18.667, y = 195 -->
  <line class="axis" x1="40" x2="600" y1="195" y2="195"/>

  <!-- stems -->
  <line class="stem" x1="133" x2="133" y1="195" y2="160"/>
  <line class="stem" x1="189" x2="189" y1="195" y2="232"/>
  <line class="stem" x1="283" x2="283" y1="195" y2="113"/>
  <line class="stem" x1="301" x2="301" y1="195" y2="278"/>
  <line class="stem" x1="320" x2="320" y1="195" y2="160"/>
  <line class="stem" x1="376" x2="376" y1="195" y2="232"/>
  <line class="stem" x1="395" x2="395" y1="195" y2="113"/>
  <line class="stem" x1="451" x2="451" y1="195" y2="278"/>
  <line class="stem" x1="544" x2="544" y1="195" y2="160"/>
  <line class="stem" x1="581" x2="581" y1="195" y2="232"/>

  <!-- dots -->
  <circle class="dot" cx="133" cy="195" r="6"/>
  <circle class="dot" cx="189" cy="195" r="6"/>
  <circle class="dot" cx="283" cy="195" r="6"/>
  <circle class="dot" cx="301" cy="195" r="6"/>
  <circle class="dot" cx="320" cy="195" r="6"/>
  <circle class="dot" cx="376" cy="195" r="6"/>
  <circle class="dot" cx="395" cy="195" r="6"/>
  <circle class="dot" cx="451" cy="195" r="6"/>
  <circle class="dot" cx="544" cy="195" r="6"/>
  <circle class="dot" cx="581" cy="195" r="6"/>

  <!-- labels above -->
  <text class="name" x="133" y="138" text-anchor="middle">Fireworks AI</text>
  <text class="date" x="133" y="154" text-anchor="middle">Oct 6</text>
  <text class="name" x="283" y="91" text-anchor="middle">Zeabur</text>
  <text class="date" x="283" y="107" text-anchor="middle">Oct 14</text>
  <text class="name" x="320" y="138" text-anchor="middle">OpenCode</text>
  <text class="date" x="320" y="154" text-anchor="middle">Oct 16</text>
  <text class="name" x="395" y="91" text-anchor="middle">Railway</text>
  <text class="date" x="395" y="107" text-anchor="middle">Oct 20</text>
  <text class="name" x="544" y="138" text-anchor="middle">CommandCode</text>
  <text class="date" x="544" y="154" text-anchor="middle">Oct 28</text>

  <!-- labels below -->
  <text class="name" x="189" y="248" text-anchor="middle">Andromeda</text>
  <text class="date" x="189" y="264" text-anchor="middle">Oct 9</text>
  <text class="name" x="301" y="294" text-anchor="middle">Lightning AI</text>
  <text class="date" x="301" y="310" text-anchor="middle">Oct 15</text>
  <text class="name" x="376" y="248" text-anchor="middle">PingCAP</text>
  <text class="date" x="376" y="264" text-anchor="middle">Oct 19</text>
  <text class="name" x="451" y="294" text-anchor="middle">Warp</text>
  <text class="date" x="451" y="310" text-anchor="middle">Oct 23</text>
  <text class="name" x="581" y="248" text-anchor="middle">Northflank</text>
  <text class="date" x="581" y="264" text-anchor="middle">Oct 30</text>

  <text class="note" x="24" y="336">Dates from Wiz's Black October list; PingCAP from its own incident report.</text>
  <line class="rule" x1="24" x2="616" y1="352" y2="352"/>
  <text class="foot" x="24" y="376">Doug Tarr</text>
  <text class="foot" x="616" y="376" text-anchor="end">douglastarr.com</text>
</svg>
