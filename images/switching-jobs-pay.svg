<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 296" width="640" height="296" role="img" aria-labelledby="t d">
  <title id="t">Switching jobs pays, at least in the short run</title>
  <desc id="d">In September 2026, median gross pay grew 7.3% for people who changed employers in the past year and 4.4% for people who stayed.</desc>
  <style>
    .bg { fill: #fcfcfb; }
    .t1 { fill: #0b0b0b; font: 600 16px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .t2 { fill: #52514e; font: 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .lab { fill: #52514e; font: 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .val { fill: #0b0b0b; font: 600 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .tick { fill: #898781; font: 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .grid { stroke: #e4e3df; stroke-width: 1; }
    .zero { stroke: #8a8984; stroke-width: 1.5; }
    .base { stroke: #c9c8c2; stroke-width: 1; }
    .hi { fill: #2a78d6; }
    .mute { fill: #c3c2b7; }
    .neg { fill: #e34948; }
    .note { fill: #52514e; font: 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .foot { fill: #52514e; font: 600 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .rule { stroke: #e4e3df; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1a19; }
      .t1, .val { fill: #f0efec; }
      .t2, .lab, .note, .foot { fill: #c3c2b7; }
      .grid, .rule { stroke: #33332f; }
      .base { stroke: #4a4944; }
      .hi { fill: #3987e5; }
      .mute { fill: #5a5954; }
      .neg { fill: #e66767; }
    }
  </style>
  <rect class="bg" width="640" height="296" rx="8"/>
  <text class="t1" x="24" y="34">Switching jobs pays, at least in the short run</text>
  <text class="t2" x="24" y="54">Median year-over-year gross pay growth, US private sector, September 2026</text>
  <line class="grid" x1="176.0" x2="176.0" y1="76" y2="180"/>
  <line class="grid" x1="272.0" x2="272.0" y1="76" y2="180"/>
  <line class="grid" x1="368.0" x2="368.0" y1="76" y2="180"/>
  <line class="grid" x1="464.0" x2="464.0" y1="76" y2="180"/>
  <line class="grid" x1="560.0" x2="560.0" y1="76" y2="180"/>
  <line class="base" x1="176" x2="584" y1="180" y2="180"/>
  <text class="tick" x="176.0" y="198" text-anchor="middle">0%</text>
  <text class="tick" x="272.0" y="198" text-anchor="middle">2%</text>
  <text class="tick" x="368.0" y="198" text-anchor="middle">4%</text>
  <text class="tick" x="464.0" y="198" text-anchor="middle">6%</text>
  <text class="tick" x="560.0" y="198" text-anchor="middle">8%</text>
  <path class="hi" d="M176.0,89.0 H522.4 A4,4 0 0 1 526.4,93.0 V111.0 A4,4 0 0 1 522.4,115.0 H176.0 Z"/>
  <text class="val" x="534.4" y="107.0">7.3%</text>
  <text class="lab" x="164" y="106.5" text-anchor="end">Changed employers</text>
  <path class="mute" d="M176.0,141.0 H383.2 A4,4 0 0 1 387.2,145.0 V163.0 A4,4 0 0 1 383.2,167.0 H176.0 Z"/>
  <text class="val" x="395.2" y="159.0">4.4%</text>
  <text class="lab" x="164" y="158.5" text-anchor="end">Stayed put</text>
  <text class="note" x="24" y="226">Source: ADP National Employment Report, September 2026 (Pay Insights).</text>
  <text class="note" x="24" y="242">Changed employers: switched jobs in the past 12 months.</text>
  <line class="rule" x1="24" x2="616" y1="258" y2="258"/>
  <text class="foot" x="24" y="282">Doug Tarr</text>
  <text class="foot" x="616" y="282" text-anchor="end">douglastarr.com</text>
</svg>
