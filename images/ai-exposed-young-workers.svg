<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 296" width="640" height="296" role="img" aria-labelledby="t d">
  <title id="t">Young workers in AI-exposed jobs are losing ground</title>
  <desc id="d">Employment for workers aged 22 to 25 fell about 11% in the most AI-exposed jobs and grew about 10% in the least exposed jobs between November 2022 and June 2026.</desc>
  <style>
    .bg { fill: #fcfcfb; }
    .t1 { fill: #0b0b0b; font: 600 16px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .t2 { fill: #52514e; font: 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .lab { fill: #52514e; font: 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .val { fill: #0b0b0b; font: 600 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .tick { fill: #898781; font: 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .grid { stroke: #e4e3df; stroke-width: 1; }
    .zero { stroke: #8a8984; stroke-width: 1.5; }
    .base { stroke: #c9c8c2; stroke-width: 1; }
    .hi { fill: #2a78d6; }
    .mute { fill: #c3c2b7; }
    .neg { fill: #e34948; }
    .note { fill: #52514e; font: 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .foot { fill: #52514e; font: 600 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .rule { stroke: #e4e3df; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1a19; }
      .t1, .val { fill: #f0efec; }
      .t2, .lab, .note, .foot { fill: #c3c2b7; }
      .grid, .rule { stroke: #33332f; }
      .base { stroke: #4a4944; }
      .hi { fill: #3987e5; }
      .mute { fill: #5a5954; }
      .neg { fill: #e66767; }
    }
  </style>
  <rect class="bg" width="640" height="296" rx="8"/>
  <text class="t1" x="24" y="34">Young workers in AI-exposed jobs are losing ground</text>
  <text class="t2" x="24" y="54">Employment change for workers aged 22 to 25, November 2022 to June 2026</text>
  <line class="grid" x1="228.0" x2="228.0" y1="76" y2="180"/>
  <line class="grid" x1="288.0" x2="288.0" y1="76" y2="180"/>
  <line class="grid" x1="348.0" x2="348.0" y1="76" y2="180"/>
  <line class="zero" x1="408.0" x2="408.0" y1="76" y2="180"/>
  <line class="grid" x1="468.0" x2="468.0" y1="76" y2="180"/>
  <line class="grid" x1="528.0" x2="528.0" y1="76" y2="180"/>
  <line class="grid" x1="588.0" x2="588.0" y1="76" y2="180"/>
  <line class="base" x1="216" x2="600" y1="180" y2="180"/>
  <text class="tick" x="228.0" y="198" text-anchor="middle">−15%</text>
  <text class="tick" x="288.0" y="198" text-anchor="middle">−10%</text>
  <text class="tick" x="348.0" y="198" text-anchor="middle">−5%</text>
  <text class="tick" x="408.0" y="198" text-anchor="middle">0</text>
  <text class="tick" x="468.0" y="198" text-anchor="middle">+5%</text>
  <text class="tick" x="528.0" y="198" text-anchor="middle">+10%</text>
  <text class="tick" x="588.0" y="198" text-anchor="middle">+15%</text>
  <path class="hi" d="M408.0,89.0 H524.0 A4,4 0 0 1 528.0,93.0 V111.0 A4,4 0 0 1 524.0,115.0 H408.0 Z"/>
  <text class="val" x="536.0" y="107.0">+10%</text>
  <text class="lab" x="200" y="106.5" text-anchor="end">Least AI-exposed jobs</text>
  <path class="neg" d="M408.0,141.0 H280.0 A4,4 0 0 0 276.0,145.0 V163.0 A4,4 0 0 0 280.0,167.0 H408.0 Z"/>
  <text class="val" x="268.0" y="159.0" text-anchor="end">−11%</text>
  <text class="lab" x="200" y="158.5" text-anchor="end">Most AI-exposed jobs</text>
  <text class="note" x="24" y="226">Source: Brynjolfsson, Chandar and Chen, Stanford Digital Economy Lab, August 2026.</text>
  <text class="note" x="24" y="242">Most exposed: top two AI-exposure quintiles. Least exposed: bottom three. Approximate.</text>
  <line class="rule" x1="24" x2="616" y1="258" y2="258"/>
  <text class="foot" x="24" y="282">Doug Tarr</text>
  <text class="foot" x="616" y="282" text-anchor="end">douglastarr.com</text>
</svg>
